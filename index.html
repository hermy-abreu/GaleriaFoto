<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuestra Boda</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f6;color:#392923;font-family:Arial,sans-serif}header{text-align:center;background:white;padding:32px 12px 20px}h1{font:italic clamp(40px,8vw,72px) Georgia,serif;margin:0;color:#392019}header .gold{color:#c9a75d;font-size:28px}header p{font-size:24px;color:#73625e;margin:8px}main{max-width:1100px;margin:auto;padding:22px 14px 160px}.viewer{position:relative;background:#eae4dd;min-height:310px;border-radius:22px;display:flex;justify-content:center;align-items:center;overflow:hidden}.viewer img{display:block;width:100%;max-height:70vh;object-fit:contain;user-select:none;-webkit-user-drag:none}.nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:1px solid white;background:#ffffffe0;font-size:30px;cursor:pointer}.left{left:14px}.right{right:14px}.counter{position:absolute;top:14px;right:14px;background:#302820ad;color:white;border-radius:30px;padding:8px 15px}.heart{position:absolute;right:18px;bottom:18px;border:0;border-radius:50%;background:white;width:65px;height:65px;font-size:38px;color:#aaa;cursor:pointer}.heart.on{color:#ed4055}.thumbs{display:flex;gap:12px;overflow-x:auto;padding:16px 0}.thumb{flex:0 0 125px;height:90px;border-radius:12px;border:3px solid transparent;overflow:hidden;background:#eae4dd;padding:0;cursor:pointer;position:relative}.thumb.current{border-color:#ed929d}.thumb img{width:100%;height:100%;object-fit:contain}.thumb b{position:absolute;right:6px;bottom:4px;color:#ed4055}footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #eee;text-align:center;padding:12px 14px 18px}footer strong{display:block;margin-bottom:10px;font-size:19px}footer strong span{color:#ed4055}.send{border:0;background:#099b38;color:white;border-radius:40px;width:min(650px,100%);padding:15px;font-size:18px;font-weight:bold;cursor:pointer}.send:disabled{background:#a6b2a9}.copy{display:block;margin:8px auto 0;border:0;background:transparent;text-decoration:underline;cursor:pointer}button:focus-visible{outline:3px solid #ba9a58}[hidden]{display:none!important}</style></head><body><header><h1>❧ Nuestra Boda ❧</h1><div class="gold">◯ ◯</div><p>Galería de Fotografías</p></header><main><section class="viewer"><div id="empty" style="text-align:center;padding:65px 20px"><h2>Próximamente, nuestras fotografías</h2><p>La galería estará disponible cuando se publiquen las imágenes.</p></div><img id="photo" alt="Foto de boda" hidden draggable="false"><button id="prev" class="nav left" aria-label="Anterior" hidden>‹</button><button id="next" class="nav right" aria-label="Siguiente" hidden>›</button><span id="counter" class="counter" hidden></span><button id="heart" class="heart" aria-label="Seleccionar fotografía" hidden>♥</button></section><div id="thumbs" class="thumbs"></div><p id="filename" style="text-align:center;color:#80746d"></p></main><footer><strong><span>♥</span> <span id="total">0</span> fotografías seleccionadas</strong><button id="send" class="send" disabled>Enviar selección por WhatsApp</button><button id="copy" class="copy" disabled>Copiar lista</button></footer><script>
const $=id=>document.getElementById(id),phone='19296025630';let photos=[],i=0;let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem('boda-favs')||'[]'))}catch{}
const chosen=()=>photos.filter(p=>fav.has(p.name)).map(p=>p.name);
const msg=()=>{let a=chosen();return '📸 Selección de fotografías — Nuestra Boda\n\n'+a.join('\n')+'\n\nTotal: '+a.length+' fotografías'};
function draw(){let p=photos[i];$('empty').hidden=!!p;['photo','prev','next','counter','heart'].forEach(id=>$(id).hidden=!p);if(p){$('photo').src=p.src;$('photo').alt=p.name;$('counter').textContent=(i+1)+' / '+photos.length;$('heart').classList.toggle('on',fav.has(p.name));$('heart').setAttribute('aria-pressed',fav.has(p.name));$('filename').textContent=p.name}else $('filename').textContent='';$('thumbs').replaceChildren();photos.forEach((p,n)=>{let b=document.createElement('button');b.className='thumb'+(i===n?' current':'');b.setAttribute('aria-label',p.name);let img=document.createElement('img');img.src=p.src;img.alt=p.name;img.loading='lazy';img.draggable=false;b.append(img);if(fav.has(p.name)){let h=document.createElement('b');h.textContent='♥';b.append(h)}b.onclick=()=>{i=n;draw()};$('thumbs').append(b)});$('total').textContent=chosen().length;$('send').disabled=$('copy').disabled=!chosen().length}
function move(n){if(photos.length){i=(i+n+photos.length)%photos.length;draw()}}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('heart').onclick=()=>{let name=photos[i]?.name;if(!name)return;fav.has(name)?fav.delete(name):fav.add(name);try{localStorage.setItem('boda-favs',JSON.stringify([...fav]))}catch{}draw()};
$('send').onclick=()=>{if(chosen().length)window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg()),'_blank','noopener,noreferrer')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg());$('copy').textContent='¡Copiado!'}catch{alert('No se pudo copiar')}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});document.addEventListener('contextmenu',e=>{if(e.target.closest('img'))e.preventDefault()});document.addEventListener('dragstart',e=>{if(e.target.closest('img'))e.preventDefault()});
fetch('photos.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{if(Array.isArray(a))photos=a.filter(p=>p&&typeof p.name==='string'&&typeof p.src==='string'&&(p.src.startsWith('photos/')||p.src.startsWith('https://drive.google.com/')||p.src.startsWith('https://drive.usercontent.google.com/'))&&!p.src.includes('..'));draw()}).catch(draw);draw();
</script></body></html>
